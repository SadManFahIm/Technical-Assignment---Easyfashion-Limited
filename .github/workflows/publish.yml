name: Publish Docker image (GHCR)

# Publishes the production image to GitHub Container Registry whenever a
# release tag lands on main (or manually from any branch).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image boots
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository }}
        run: |
          # GHCR references must be lowercase; use the version metadata-action
          # generated (tag "v1.2.3" → image tag "1.2.3"), not the raw ref name.
          IMAGE_BASE=$(echo "$IMAGE_BASE" | tr '[:upper:]' '[:lower:]')
          IMAGE="$IMAGE_BASE:${{ steps.meta.outputs.version }}"
          echo "Verifying $IMAGE"
          docker pull "$IMAGE"
          docker run -d --name verify -p 3000:3000 "$IMAGE"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || { docker logs verify; exit 1; }
          echo "✅ Published image serves HTTP 200 from ghcr.io"
          docker stop verify && docker rm verify
