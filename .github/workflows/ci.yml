name: CI

# Run on every push/PR to the integration (Develop) and production (main) branches
on:
  push:
    branches: [main, Develop]
  pull_request:
    branches: [main, Develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Test · Build · Audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Unit tests with coverage
        run: npm run test:coverage

      # Dynamic README badges (tests count + coverage %) live on the
      # ci-badges branch; refreshed only on pushes to Develop/main so
      # PR runs can never overwrite them.
      - name: Publish dynamic badges
        if: github.event_name == 'push' && (github.ref == 'refs/heads/Develop' || github.ref == 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/publish-badges.sh

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Coverage summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage report produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: npm run build

      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npx playwright test

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: easy-fashion-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container & smoke test
        run: |
          docker run -d --name dashboard -p 3000:3000 easy-fashion-dashboard:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ "$code" = "200" ]; then
              echo "✅ Homepage answered 200"
              break
            fi
            echo "waiting for container… ($i/30)"
            sleep 2
          done
          [ "$code" = "200" ] || { docker logs dashboard; exit 1; }
          for route in / /dashboard2 /dashboard3; do
            echo "GET $route → $(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000$route)"
          done
          docker stop dashboard && docker rm dashboard
